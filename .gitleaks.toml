[source]
name = "gitleaks"
path = ""
filename = ""

[[rules]]
id = "dev-secret-key-placeholder"
description = "Allow development secret key placeholder in config.py"
regex = '''secret_key.*=.*["']dev-secret-change-in-production["']'''
tags = ["development", "placeholder"]
allowlist = ["app/config.py", "conftest.py"]

[[rules.allowlist]]
regex = "test-secret-key-for-unit-tests-only"
paths = ["conftest.py", "test_"]

# Allow Firebase and other service keys to be set via environment variables
[[rules]]
id = "allow-env-vars"
description = "Allow config keys that are set via environment variables"
regex = '''(firebase_credentials_path|sendgrid_api_key|google_play_credentials_path)'''
tags = ["environment-variables"]
