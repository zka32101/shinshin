name: Upload AAB/APK to Google Drive

on:
  workflow_call:
    secrets:
      GOOGLE_DRIVE_FOLDER_ID:
        required: true
      GOOGLE_DRIVE_SERVICE_ACCOUNT:
        required: true

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Setup rclone
        run: |
          sudo apt-get update && sudo apt-get install -y rclone

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT }}" > /tmp/sa.json

          rclone config create gdrive drive \
            service_account_file /tmp/sa.json

      - name: Upload AAB
        continue-on-error: true
        run: |
          if [ -f "build/app/outputs/bundle/release/app-release.aab" ]; then
            rclone copy build/app/outputs/bundle/release/app-release.aab \
              gdrive:${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}/
            echo "✅ AAB uploaded"
          fi

      - name: Upload APK
        continue-on-error: true
        run: |
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            rclone copy build/app/outputs/flutter-apk/app-release.apk \
              gdrive:${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}/
            echo "✅ APK uploaded"
          fi

      - name: Cleanup
        run: |
          rm -f /tmp/sa.json
