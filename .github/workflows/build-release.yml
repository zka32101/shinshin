name: Build Release (Android)

on:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    name: Build Android Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ========================================
      # Java & Build Tools セットアップ
      # ========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # ========================================
      # Flutter セットアップ
      # ========================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      # ========================================
      # キーストアファイルを復元
      # ========================================
      - name: Prepare Keystore File
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "Setting up Android keystore..."

          # キーストアをデコード
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-keystore.jks

          # ファイルが正しく作成されたか確認
          ls -lh android/app/release-keystore.jks

      # ========================================
      # 環境変数をエクスポート（署名設定用）
      # ========================================
      - name: Setup Signing Environment Variables
        run: |
          echo "KEYSTORE_PATH=${{ github.workspace }}/android/app/release-keystore.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEYSTORE_ALIAS=${{ secrets.KEYSTORE_ALIAS }}" >> $GITHUB_ENV
          echo "KEYSTORE_KEY_PASSWORD=${{ secrets.KEYSTORE_KEY_PASSWORD }}" >> $GITHUB_ENV

      # ========================================
      # Flutter 依存関係とコード生成
      # ========================================
      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Clean build directory
        run: flutter clean

      - name: Run code generation
        run: flutter pub run build_runner build --delete-conflicting-outputs

      # ========================================
      # Android リリースビルド
      # ========================================
      - name: Build APK Release
        run: flutter build apk --release
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}

      - name: Build AAB Release
        run: flutter build appbundle --release
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/release-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}

      # ========================================
      # ビルド成果物をアップロード
      # ========================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-release
          path: build/app/outputs/apk/release/app-release.apk
          retention-days: 7

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-release
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

      # ========================================
      # GitHub Release を作成
      # ========================================
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/app/outputs/apk/release/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ========================================
      # ビルド成功ログを出力
      # ========================================
      - name: Build Success Summary
        run: |
          echo "=================================================="
          echo "✅ Android Release Build Complete"
          echo "=================================================="
          echo ""
          echo "📦 Build Artifacts:"
          echo "  APK:  build/app/outputs/apk/release/app-release.apk"
          echo "  AAB:  build/app/outputs/bundle/release/app-release.aab"
          echo ""
          echo "📊 File Info:"
          ls -lh build/app/outputs/apk/release/app-release.apk
          ls -lh build/app/outputs/bundle/release/app-release.aab
          echo ""
          echo "🎯 Next Steps:"
          echo "  1. APK: Manual device testing"
          echo "  2. AAB: Upload to Google Play Console"
          echo "=================================================="

  # ========================================
  # Google Drive にアップロード
  # ========================================
  upload-to-google-drive:
    name: Upload to Google Drive
    needs: build-android
    runs-on: ubuntu-latest
    if: success()
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: build-artifacts

      - name: Setup rclone
        run: |
          sudo apt-get update && sudo apt-get install -y rclone

      - name: Configure rclone
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$GOOGLE_DRIVE_SERVICE_ACCOUNT" > /tmp/sa.json
          rclone config create gdrive drive service_account_file /tmp/sa.json

      - name: Upload AAB to Google Drive
        continue-on-error: true
        run: |
          AAB_PATH="build-artifacts/android-aab-release/app-release.aab"
          if [ -f "$AAB_PATH" ]; then
            rclone copy "$AAB_PATH" \
              "gdrive:${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}/" \
              --progress
            echo "✅ AAB uploaded to Google Drive"
          else
            echo "⚠️  AAB not found at $AAB_PATH"
          fi

      - name: Upload APK to Google Drive
        continue-on-error: true
        run: |
          APK_PATH="build-artifacts/android-apk-release/app-release.apk"
          if [ -f "$APK_PATH" ]; then
            rclone copy "$APK_PATH" \
              "gdrive:${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}/" \
              --progress
            echo "✅ APK uploaded to Google Drive"
          else
            echo "⚠️  APK not found at $APK_PATH"
          fi

      - name: Cleanup
        if: always()
        run: |
          rm -f /tmp/sa.json
