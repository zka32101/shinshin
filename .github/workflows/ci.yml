name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # ============ Flutter Unit & Integration Tests ============
  flutter-test:
    name: Flutter Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true

      - name: Setup Java & Android SDK environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set Android SDK environment variables
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_GRADLE_JVM_ARGS=-Xmx2048m" >> $GITHUB_ENV
          echo "FLUTTER_SUPPRESS_ANALYTICS=true" >> $GITHUB_ENV
          echo "Android SDK Root: $ANDROID_SDK_ROOT"

      - name: Verify Flutter and Dart versions
        run: |
          echo "=== Flutter Version ==="
          flutter --version
          echo ""
          echo "=== Dart Version ==="
          dart --version
          echo ""
          echo "=== Current pubspec.yaml ==="
          head -15 pubspec.yaml

      - name: Create Android local.properties
        run: |
          cat > android/local.properties << 'PROPERTIES_EOF'
          sdk.dir=$ANDROID_SDK_ROOT
          flutter.sdk=$FLUTTER_HOME
          PROPERTIES_EOF

      - name: Initialize Android project
        run: |
          cd android
          chmod +x gradlew 2>/dev/null || true
          ./gradlew --version || true
          cd ..

      - name: Clean Flutter cache and regenerate dependencies
        run: |
          echo "Cleaning Flutter cache with flutter clean..."
          flutter clean
          echo "Removed .dart_tool and build artifacts"
          rm -rf android/.gradle android/app/build android/build pubspec.lock
          echo "Cleaned Android gradle and build cache"

      - name: Install dependencies
        run: |
          echo "=== Running flutter pub get (verbose) ==="
          flutter pub get --verbose --no-offline 2>&1 | tail -100

      - name: Run code generation
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Run unit tests
        run: flutter test --coverage --exclude-tags="integration"

      - name: Run integration tests
        run: flutter test test/integration_tests/ --coverage

      - name: Run performance tests
        run: flutter test test/performance_test.dart --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: coverage/lcov.info
          flags: flutter

      - name: Generate coverage report
        if: always()
        run: |
          if command -v genhtml &> /dev/null; then
            genhtml coverage/lcov.info -o coverage/html
            echo "Coverage report generated"
          fi

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request' && always()
        uses: romeovs/lcov-reporter-action@v0.3.1
        with:
          lcov-file: ./coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # ============ Backend Tests ============
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shougaku_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt aiosqlite

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/shougaku_test
          SECRET_KEY: test-secret-key-not-for-production-use-12345678
          FIREBASE_PROJECT_ID: test-project
          DEBUG: true
        run: pytest -vv --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: backend/coverage.xml
          flags: backend

  # ============ Detailed Integration Tests ============
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: flutter-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true

      - name: Setup Java & Android SDK environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set Android SDK environment variables
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_GRADLE_JVM_ARGS=-Xmx2048m" >> $GITHUB_ENV
          echo "FLUTTER_SUPPRESS_ANALYTICS=true" >> $GITHUB_ENV
          echo "Android SDK Root: $ANDROID_SDK_ROOT"

      - name: Create Android local.properties
        run: |
          cat > android/local.properties << 'PROPERTIES_EOF'
          sdk.dir=$ANDROID_SDK_ROOT
          flutter.sdk=$FLUTTER_HOME
          PROPERTIES_EOF

      - name: Clean Flutter cache
        run: |
          flutter clean
          rm -rf android/.gradle android/app/build android/build pubspec.lock
          echo "Cache cleaned"

      - name: Install dependencies
        run: flutter pub get --verbose --no-offline

      - name: Run code generation
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Run app flow tests
        run: flutter test test/integration_tests/app_flow_test.dart -v

      - name: Run firebase integration tests
        run: flutter test test/integration_tests/firebase_integration_test.dart -v

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: test-results/
          retention-days: 30

  # ============ Performance Tests ============
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: flutter-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true

      - name: Setup Java & Android SDK environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set Android SDK environment variables
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_GRADLE_JVM_ARGS=-Xmx2048m" >> $GITHUB_ENV
          echo "FLUTTER_SUPPRESS_ANALYTICS=true" >> $GITHUB_ENV
          echo "Android SDK Root: $ANDROID_SDK_ROOT"

      - name: Create Android local.properties
        run: |
          cat > android/local.properties << 'PROPERTIES_EOF'
          sdk.dir=$ANDROID_SDK_ROOT
          flutter.sdk=$FLUTTER_HOME
          PROPERTIES_EOF

      - name: Clean Flutter cache
        run: |
          flutter clean
          rm -rf android/.gradle android/app/build android/build pubspec.lock
          echo "Cache cleaned"

      - name: Install dependencies
        run: flutter pub get --verbose --no-offline

      - name: Run code generation
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Run performance benchmarks
        run: flutter test test/performance_test.dart --verbose 2>&1 | tee perf-results.txt

      - name: Parse performance results
        if: always()
        run: |
          echo "## Performance Test Results" >> $GITHUB_STEP_SUMMARY
          grep -E "Performance Benchmark Report|Average:|Min:|Max:|Count:" perf-results.txt >> $GITHUB_STEP_SUMMARY || true

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-test-results
          path: perf-results.txt
          retention-days: 30

      - name: Comment performance on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = fs.readFileSync('perf-results.txt', 'utf8');

            // Check for performance regressions
            const comment = `## Performance Test Results\n\n\`\`\`\n${results}\n\`\`\``;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # ============ Flutter Build Check ============
  flutter-build:
    name: Flutter Build Check
    runs-on: ubuntu-latest
    needs: [flutter-test, integration-tests, performance-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true

      - name: Setup Java (for Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get --verbose

      - name: Run code generation
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build APK (debug)
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  # ========================================
  # Google Drive にアップロード（オプション）
  # ========================================
  upload-debug-to-google-drive:
    name: Upload Debug APK to Google Drive
    needs: flutter-build
    runs-on: ubuntu-latest
    if: success() && secrets.GOOGLE_DRIVE_FOLDER_ID != ''
    steps:
      - uses: actions/checkout@v4

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: debug-apk

      - name: Setup rclone
        run: |
          sudo apt-get update && sudo apt-get install -y rclone

      - name: Configure rclone
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$GOOGLE_DRIVE_SERVICE_ACCOUNT" > /tmp/sa.json
          rclone config create gdrive drive service_account_file /tmp/sa.json

      - name: Upload Debug APK to Google Drive
        continue-on-error: true
        run: |
          APK_PATH="debug-apk/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            rclone copy "$APK_PATH" \
              "gdrive:${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}/debug/" \
              --progress
            echo "✅ Debug APK uploaded to Google Drive"
          else
            echo "⚠️  APK not found at $APK_PATH"
          fi

      - name: Cleanup
        if: always()
        run: |
          rm -f /tmp/sa.json
