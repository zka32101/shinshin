name: Auto-merge PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: ["Flutter Linting & Analysis", "Flutter Tests"]
    types: [completed]

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' || contains(github.head_ref, 'fix/') || contains(github.head_ref, 'chore/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR status and CI
        id: check_status
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}

          if [ -z "$PR_NUMBER" ]; then
            echo "No PR number found in event"
            exit 0
          fi

          # Check if PR is draft
          DRAFT=$(gh pr view $PR_NUMBER --json isDraft --jq '.isDraft')
          if [ "$DRAFT" = "true" ]; then
            echo "PR is draft, skipping auto-merge"
            exit 0
          fi

          # Check if all required checks passed
          CHECKS=$(gh pr view $PR_NUMBER --json statusCheckRollup --jq '.statusCheckRollup[].status')
          if echo "$CHECKS" | grep -q "PENDING"; then
            echo "Some checks are still pending"
            exit 0
          fi

          if echo "$CHECKS" | grep -q "FAILURE"; then
            echo "Some checks failed"
            exit 0
          fi

          echo "All checks passed, enabling auto-merge"
          echo "can_merge=true" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for PR
        if: steps.check_status.outputs.can_merge == 'true'
        run: |
          gh pr merge ${{ github.event.pull_request.number }} \
            --squash \
            --auto
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
