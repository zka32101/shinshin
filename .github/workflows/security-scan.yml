name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # 毎日午前 2:00 UTC にスキャンを実行
    - cron: '0 2 * * *'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # ========================================
  # Dart/Flutter コードスキャン
  # ========================================
  flutter-lint:
    name: Flutter Linting & Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Setup Java & Android SDK environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set Android SDK environment variables
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_GRADLE_JVM_ARGS=-Xmx2048m" >> $GITHUB_ENV
          echo "FLUTTER_SUPPRESS_ANALYTICS=true" >> $GITHUB_ENV
          echo "Android SDK Root: $ANDROID_SDK_ROOT"

      - name: Create Android local.properties
        run: |
          cat > android/local.properties << 'PROPERTIES_EOF'
          sdk.dir=$ANDROID_SDK_ROOT
          flutter.sdk=$FLUTTER_HOME
          PROPERTIES_EOF

      - name: Clean Flutter cache and regenerate dependencies
        run: |
          echo "Cleaning Flutter cache with flutter clean..."
          flutter clean
          echo "Removed .dart_tool and build artifacts"
          rm -rf android/.gradle android/app/build android/build pubspec.lock
          echo "Cleaned Android gradle and build cache"

      - name: Get dependencies
        run: flutter pub get --verbose --no-offline

      - name: Run code generation
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Run Flutter Analyzer
        run: flutter analyze --no-pub

  # ========================================
  # 秘密情報スキャン
  # ========================================
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1  # Only fetch latest commit to avoid scanning full history

      # Gitleaks を使用した秘密情報スキャン
      # Using v1 to avoid licensing requirements; v2+ requires paid license
      - name: Run Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERBOSE: "true"
        with:
          args: --verbose --log-level=debug

  # ========================================
  # Python バックエンド スキャン
  # ========================================
  python-security:
    name: Python Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt bandit safety

      # Bandit で Python セキュリティの問題をスキャン
      - name: Run Bandit Security Scan
        run: |
          bandit -r app/ -f json -o bandit-report.json || true
          bandit -r app/ || true

      # Safety で依存関係の脆弱性をスキャン
      - name: Run Safety Vulnerability Check
        run: |
          safety check --json --output safety-report.json || true
          safety check || true

      # レポートをアップロード
      - name: Upload Bandit Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: backend/bandit-report.json

      - name: Upload Safety Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safety-report
          path: backend/safety-report.json

  # ========================================
  # Dependency チェック
  # ========================================
  dependency-check:
    name: Dependency Vulnerability Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Pub のセキュリティアドバイザリをチェック
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Setup Java & Android SDK environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set Android SDK environment variables
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_GRADLE_JVM_ARGS=-Xmx2048m" >> $GITHUB_ENV
          echo "FLUTTER_SUPPRESS_ANALYTICS=true" >> $GITHUB_ENV
          echo "Android SDK Root: $ANDROID_SDK_ROOT"

      - name: Check Pub Dependencies
        run: |
          flutter pub get
          flutter pub outdated --no-dev-dependencies || true

      # Pub Security アドバイザリをチェック
      - name: Check for Known Vulnerabilities
        run: |
          dart pub global activate pana
          pana --no-warning || true

  # ========================================
  # コンテナイメージスキャン（オプション）
  # ========================================
  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    if: contains(github.event_name, 'push') || contains(github.event_name, 'schedule')

    steps:
      - uses: actions/checkout@v4

      # Dockerfile がある場合のみスキャン
      - name: Check for Dockerfile
        id: dockerfile
        run: |
          if [ -f "Dockerfile" ] || [ -f "backend/Dockerfile" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Container Image
        if: steps.dockerfile.outputs.exists == 'true'
        run: |
          if [ -f "backend/Dockerfile" ]; then
            docker build -t shougaku-kore:test -f backend/Dockerfile .
          elif [ -f "Dockerfile" ]; then
            docker build -t shougaku-kore:test .
          fi

      # Trivy を使用したイメージスキャン
      - name: Run Trivy Vulnerability Scanner
        if: steps.dockerfile.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'shougaku-kore:test'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy Results to GitHub Security
        if: steps.dockerfile.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  # ========================================
  # セキュリティレポート生成
  # ========================================
  security-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: [flutter-lint, secret-scan, python-security, dependency-check]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Download All Reports
        uses: actions/download-artifact@v4
        with:
          path: security-reports

      - name: Generate Security Summary
        run: |
          cat > SECURITY_REPORT.md << 'EOF'
          # セキュリティスキャンレポート

          **スキャン日時**: $(date)
          **ブランチ**: ${{ github.ref }}
          **コミット**: ${{ github.sha }}

          ## スキャン結果サマリー

          - ✅ Flutter Linting: 完了
          - ✅ Secret Detection: 完了
          - ✅ Python Security: 完了
          - ✅ Dependency Check: 完了
          - ✅ Container Scan: 完了

          詳細レポートは Artifacts を参照してください。

          ## 重要な警告

          セキュリティスキャンで重大な問題が検出された場合は、
          リポジトリ管理者に報告してください。

          ---
          **生成**: GitHub Actions Security Workflow
          EOF

      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: SECURITY_REPORT.md

      - name: Post Report to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('SECURITY_REPORT.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🔒 Security Scan Results:\n\n' + report
            });

  # ========================================
  # CI 結果チェック
  # ========================================
  security-check-status:
    name: Security Check Status
    runs-on: ubuntu-latest
    needs: [flutter-lint, secret-scan, python-security, dependency-check]
    if: always()

    steps:
      - name: Check Results
        run: |
          if [ "${{ needs.flutter-lint.result }}" != "success" ]; then
            echo "❌ Flutter Linting failed"
            exit 1
          fi

          if [ "${{ needs.secret-scan.result }}" != "success" ]; then
            echo "❌ Secret Detection failed"
            exit 1
          fi

          if [ "${{ needs.python-security.result }}" != "success" ]; then
            echo "⚠️ Python Security issues found"
          fi

          if [ "${{ needs.dependency-check.result }}" != "success" ]; then
            echo "⚠️ Dependency vulnerabilities found"
          fi

          echo "✅ Security checks completed"

      - name: Notify Security Issues
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚨 **Security issues detected!**\n\nPlease review the scan results and address any critical issues before merging.'
            });
