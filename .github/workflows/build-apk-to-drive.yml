name: Lightweight Code Quality Checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  quality-checks:
    name: Code Quality & Lint Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ========================================
      # Flutter セットアップ（軽量版）
      # ========================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      # ========================================
      # 依存関係の取得
      # ========================================
      - name: Get Flutter dependencies
        run: flutter pub get

      # ========================================
      # コード生成（dart_builder用）
      # ========================================
      - name: Run code generation
        run: flutter pub run build_runner build --delete-conflicting-outputs

      # ========================================
      # Lint チェック
      # ========================================
      - name: Run Flutter analyze
        run: flutter analyze --fatal-infos
        continue-on-error: true

      # ========================================
      # Dart Format チェック
      # ========================================
      - name: Check Dart formatting
        run: dart format --set-exit-if-changed lib/
        continue-on-error: true

      # ========================================
      # Lints（カスタムリントルール）
      # ========================================
      - name: Run custom lints
        run: flutter pub run custom_lint
        continue-on-error: true

      # ========================================
      # テスト実行（ユニットテスト）
      # ========================================
      - name: Run unit tests
        run: flutter test --coverage
        continue-on-error: true

      # ========================================
      # テストカバレッジレポート
      # ========================================
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
        continue-on-error: true

      # ========================================
      # チェック完了サマリー
      # ========================================
      - name: Quality Check Summary
        run: |
          echo "=================================================="
          echo "✅ Code Quality Checks Completed"
          echo "=================================================="
          echo ""
          echo "📋 Checks Performed:"
          echo "  ✓ Flutter Analyze (Static Analysis)"
          echo "  ✓ Dart Format (Code Formatting)"
          echo "  ✓ Custom Lints (Linting Rules)"
          echo "  ✓ Unit Tests (Testing)"
          echo ""
          echo "💡 Notes:"
          echo "  - This is a lightweight CI pipeline"
          echo "  - APK/AAB builds must be done locally"
          echo "  - See README.md for local build instructions"
          echo "=================================================="
