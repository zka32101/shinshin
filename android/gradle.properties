# Gradle System Properties
# Optimized for CI/CD environments with limited memory

# JVM Memory Configuration - Minimal heap for GitHub Actions runner
org.gradle.jvmargs=-Xmx256m -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:+DisableExplicitGC -XX:+TieredCompilation -XX:TieredStopAtLevel=1 -Dfile.encoding=UTF-8

# Build Performance & Memory - Aggressive single-threaded mode
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.configureondemand=true
org.gradle.vfs.watch=false

# Daemon & Caching
org.gradle.daemon=false
org.gradle.caching=true

# Kotlin Compiler Options - Reduce memory footprint
kotlin.incremental=true
kotlin.incremental.java=true
kotlin.compiler.execution.strategy=in-process

# Android Gradle Plugin Options
android.enableParallelJsonWrite=false
android.useAndroidX=true
