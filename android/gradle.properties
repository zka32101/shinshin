# Gradle System Properties
# Optimized for CI/CD environments with limited memory

# JVM Memory Configuration
org.gradle.jvmargs=-Xmx384m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+DisableExplicitGC -Dfile.encoding=UTF-8

# Build Performance & Memory
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.configureondemand=true

# Daemon & Caching
org.gradle.daemon=false
org.gradle.caching=true

# Kotlin Compiler Options
kotlin.incremental=true
kotlin.incremental.java=true
